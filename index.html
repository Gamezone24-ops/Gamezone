
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameZone - Tienda de videojuegos</title>
<style>
body{margin:0;background:#0b0d12;color:white;font-family:Arial,sans-serif}
header{padding:22px 7%;border-bottom:1px solid #303747;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.logo{font-size:30px;font-weight:bold}.logo span{color:#08c9ff}
input{padding:12px;border-radius:8px;background:#171b25;color:white;border:1px solid #343747}
main{padding:30px 7%}
.hero{padding:35px;background:linear-gradient(120deg,#12345b,#171b25);border-radius:15px}
h1{font-size:35px}.blue{color:#08c9ff}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-top:22px}
.game{background:#171b25;border:1px solid #303747;padding:17px;border-radius:12px}
.cover{height:125px;display:grid;place-items:center;font-size:55px;background:linear-gradient(135deg,#123f65,#25203f);border-radius:8px}
.price{color:#08c9ff;font-weight:bold}
button{background:#0788d1;color:white;border:0;border-radius:7px;padding:11px;cursor:pointer}
footer{text-align:center;padding:30px;color:#aab3c2}
</style>
</head>
<body>
<header>
<div class="logo">Game<span>Zone</span> 🎮</div>
<input id="search" placeholder="Buscar juegos...">
</header>
<main>
<section class="hero">
<h1>Bienvenido a <span class="blue">GameZone</span></h1>
<p>Descubrí tu próxima aventura.</p>
<button onclick="document.getElementById('catalog').scrollIntoView()">Ver juegos</button>
</section>
<h2>🎮 Juegos destacados</h2>
<section class="games" id="catalog">
<article class="game" data-name="aventura espacial">
<div class="cover">🚀</div>
<h3>Aventura espacial</h3>
<p>Explorá nuevos mundos.</p>
<p class="price">Gratis</p>
<button onclick="alert('Próximamente agregaremos el enlace oficial del juego.')">Ver juego</button>
</article>
<article class="game" data-name="carrera extrema">
<div class="cover">🏎️</div>
<h3>Carrera extrema</h3>
<p>Velocidad y competición.</p>
<p class="price">Gratis</p>
<button onclick="alert('Próximamente agregaremos el enlace oficial del juego.')">Ver juego</button>
</article>
<article class="game" data-name="mundo pixel">
<div class="cover">👾</div>
<h3>Mundo Pixel</h3>
<p>Una aventura independiente.</p>
<p class="price">Gratis</p>
<button onclick="alert('Próximamente agregaremos el enlace oficial del juego.')">Ver juego</button>
</article>
</section>
</main>
<footer>GameZone © 2026 · Tu tienda de videojuegos</footer>
<script>
document.getElementById('search').addEventListener('input',function(){
let q=this.value.toLowerCase();
document.querySelectorAll('.game').forEach(g=>{
g.style.display=g.dataset.name.includes(q)?'':'none';
});
});
</script>
</body>
</html>
